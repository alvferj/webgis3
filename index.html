<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Comparação WMS</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-side-by-side@2.4.0/leaflet-side-by-side.min.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-side-by-side@2.4.0/leaflet-side-by-side.min.js"></script>

    <script>
        var map = L.map('map').setView([-15.7801, -47.9292], 6); // Centralizado no Brasil

        // Mapa base de fundo
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Camada WMS da Esquerda (Exemplo: IBGE Mosaico ou feições)
        var wmsEsquerda = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            layers: '0', // Substitua pelo nome da camada do servidor WMS
            format: 'image/png',
            transparent: true,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd'
        }).addTo(map);

        // Camada WMS da Direita (Exemplo: Outro ano ou outra base WMS)
        var wmsDireita = L.tileLayer.wms('https://wms.mma.gov.br/geoserver/wms', {
            layers: 'mma:sua_camada_aqui', // Substitua pelo serviço WMS desejado
            format: 'image/png',
            transparent: true,
            attribution: 'MMA WMS'
        }).addTo(map);

        // Ferramenta Swipe para comparar as duas fontes WMS
        L.control.sideBySide(wmsEsquerda, wmsDireita).addTo(map);
    </script>

</body>
</html>
