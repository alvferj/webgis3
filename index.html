<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Comparação WMS com GeoJSON</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-side-by-side@2.4.0/leaflet-side-by-side.min.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-side-by-side@2.4.0/leaflet-side-by-side.min.js"></script>

    <script>
        // Centralizado nas coordenadas solicitadas (-22.1468, -48.9995) com zoom 11
        var map = L.map('map').setView([-22.1468, -48.9995], 11);

        // Mapa base de fundo (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Camada WMS da Esquerda
        var wmsEsquerda = L.tileLayer.wms('https://wms.mma.gov.br/geoserver/wms', {
            layers: 'mma:sua_camada_esquerda_aqui', // Substitua pelo serviço/camada desejada
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            attribution: 'MMA WMS - Esquerda'
        }).addTo(map);

        // Camada WMS da Direita
        var wmsDireita = L.tileLayer.wms('https://wms.mma.gov.br/geoserver/wms', {
            layers: 'mma:sua_camada_direita_aqui', // Substitua pelo serviço/camada desejada
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            attribution: 'MMA WMS - Direita'
        }).addTo(map);

        // Ferramenta Swipe para comparar as duas fontes WMS
        L.control.sideBySide(wmsEsquerda, wmsDireita).addTo(map);

        // Função para carregar e adicionar o ficheiro area.geojson ao mapa
        fetch('area.geojson')
            .then(response => response.json())
            .then(data => {
                var camadaGeoJson = L.geoJSON(data, {
                    style: {
                        color: '#ff7800',      // Cor do contorno
                        weight: 3,             // Espessura da linha
                        opacity: 0.8,
                        fillColor: '#ff7800',  // Cor de preenchimento
                        fillOpacity: 0.2       // Transparência do preenchimento
                    },
                    onEachFeature: function (feature, layer) {
                        // Se houver propriedades no GeoJSON, mostra num pop-up simples
                        if (feature.properties && feature.properties.nome) {
                            layer.bindPopup('Área: ' + feature.properties.nome);
                        }
                    }
                }).addTo(map);

                // Opcional: ajustar o zoom do mapa automaticamente para os limites da área do GeoJSON
                // map.fitBounds(camadaGeoJson.getBounds());
            })
            .catch(error => console.error('Erro ao carregar o ficheiro area.geojson:', error));
    </script>

</body>
</html>
