<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Comparação DataGeo vs ArcGIS Atualizado</title>
    
    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }
        
        /* Painel informativo superior */
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        /* Controlo Deslizante (Swipe) Personalizado */
        .swipe-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-family: Arial, sans-serif;
            text-align: center;
            width: 320px;
        }
        .swipe-container input {
            width: 100%;
            cursor: pointer;
        }
        .swipe-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="info-panel">
        <strong>Comparação WebGIS</strong><br>
        DataGeo SP vs ArcGIS Satélite (Mais Recente)
    </div>

    <div id="map"></div>

    <!-- Barra de Controlo Deslizante NATIVA -->
    <div class="swipe-container">
        <label for="rangeSwipe"><strong>Controlo de Transparência / Camada</strong></label>
        <input type="range" id="rangeSwipe" min="0" max="1" step="0.05" value="1">
        <div class="swipe-labels">
            <span>DataGeo (2010)</span>
            <span>ArcGIS Atual</span>
        </div>
    </div>

    <!-- JS Principal do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Inicialização do mapa centrado
        var map = L.map('map').setView([-22.1468, -48.9995], 11);

        // Mapa base de fundo geral (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 1. Camada de Fundo Direita: ArcGIS World Imagery (Versão mais recente e detalhada com zoom estendido)
        var camadaDireita = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 22,
            maxNativeZoom: 19,
            attribution: 'Esri World Imagery (Mais Recente)'
        }).addTo(map);

        // 2. Camada Esquerda (Superposta): WMS DataGeo SP
        var camadaEsquerda = L.tileLayer.wms('https://datageo.ambiente.sp.gov.br/geoimage/datageoimg/ows', {
            layers: 'ORTOFOTOS_EMPLASA_2010', 
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            attribution: 'DataGeo SP'
        }).addTo(map);

        // Controlo interativo para ajustar a opacidade (transição suave)
        document.getElementById('rangeSwipe').addEventListener('input', function(e) {
            var valorOpacidade = parseFloat(e.target.value);
            camadaEsquerda.setOpacity(valorOpacidade);
        });

        // 3. Carregamento do ficheiro area.geojson (requer servidor local ativo, ex: Live Server)
        fetch('area.geojson')
            .then(response => {
                if (!response.ok) throw new Error('Erro ao aceder ao ficheiro geojson');
                return response.json();
            })
            .then(data => {
                var camadaGeoJson = L.geoJSON(data, {
                    style: {
                        color: '#ff7800',
                        weight: 3,
                        opacity: 0.8,
                        fillColor: '#ff7800',
                        fillOpacity: 0.2
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && feature.properties.nome) {
                            layer.bindPopup('Área: ' + feature.properties.nome);
                        }
                    }
                }).addTo(map);

                // Ajusta o zoom automaticamente para os limites do polígono
                map.fitBounds(camadaGeoJson.getBounds());
            })
            .catch(error => console.warn('Aviso do GeoJSON: Utilize um servidor local (ex: Live Server no VS Code).', error));
    </script>

</body>
</html>
