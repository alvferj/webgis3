<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Comparação DataGeo vs ArcGIS</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-side-by-side@2.4.0/leaflet-side-by-side.min.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Scripts do Leaflet e Leaflet-side-by-side -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-side-by-side@2.4.0/leaflet-side-by-side.min.js"></script>
    <!-- Script do Esri Leaflet para suportar MapServer do ArcGIS -->
    <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

    <script>
        // Centralizado nas coordenadas solicitadas com zoom 11
        var map = L.map('map').setView([-22.1468, -48.9995], 11);

        // Mapa base de fundo (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 1. Lado Esquerdo: WMS DataGeo SP
        var wmsEsquerda = L.tileLayer.wms('https://datageo.ambiente.sp.gov.br/geoimage/datageoimg/ows', {
            layers: 'ORTOFOTOS_EMPLASA_2010
', // Substitua pelo nome técnico da camada no DataGeo
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            attribution: 'DataGeo SP'
        }).addTo(map);

        // 2. Lado Direito: ArcGIS World Imagery (MapServer)
        var wmsDireita = L.esri.tiledMapLayer({
            url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer',
            maxZoom: 19,
            attribution: 'Esri World Imagery'
        }).addTo(map);

        // Ferramenta Swipe (Lado a lado)
        L.control.sideBySide(wmsEsquerda, wmsDireita).addTo(map);

        // 3. Carregamento opcional do ficheiro area.geojson (requer servidor local ativo)
        fetch('area.geojson')
            .then(response => {
                if (!response.ok) throw new Error('Erro ao aceder ao ficheiro geojson');
                return response.json();
            })
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: '#ff7800',
                        weight: 3,
                        opacity: 0.8,
                        fillColor: '#ff7800',
                        fillOpacity: 0.2
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && feature.properties.nome) {
                            layer.bindPopup('Área: ' + feature.properties.nome);
                        }
                    }
                }).addTo(map);
            })
            .catch(error => console.warn('Aviso do GeoJSON: Utilize um servidor local (ex: Live Server) para carregar o ficheiro.', error));
    </script>

</body>
</html>
