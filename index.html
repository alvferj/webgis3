<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Comparação WMS com GeoJSON</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-side-by-side@2.4.0/leaflet-side-by-side.min.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-side-by-side@2.4.0/leaflet-side-by-side.min.js"></script>

    <script>
        // Centralizado nas coordenadas solicitadas com zoom 11
        var map = L.map('map').setView([-22.1468, -48.9995], 11);

        // Mapa base de fundo (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Camada WMS da Esquerda (Exemplo de WMS público do IBGE)
        var wmsEsquerda = L.tileLayer.wms('https://geoservicos.ibge.gov.br/geoserver/wms', {
            layers: 'Cidades', // Exemplo de camada do IBGE
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            attribution: 'IBGE'
        }).addTo(map);

        // Camada WMS da Direita (Substitua pela sua URL e camada real do GeoServer)
        var wmsDireita = L.tileLayer.wms('https://wms.mma.gov.br/geoserver/wms', {
            layers: 'mma:sua_camada_aqui', 
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            attribution: 'MMA'
        }).addTo(map);

        // Ferramenta Swipe (Certifique-se de que ambas as camadas estão visíveis)
        L.control.sideBySide(wmsEsquerda, wmsDireita).addTo(map);

        // Carregar o ficheiro area.geojson (Requer servidor local ativo)
        fetch('area.geojson')
            .then(response => {
                if (!response.ok) throw new Error('Erro ao aceder ao ficheiro geojson');
                return response.json();
            })
            .then(data => {
                var camadaGeoJson = L.geoJSON(data, {
                    style: {
                        color: '#ff7800',
                        weight: 3,
                        opacity: 0.8,
                        fillColor: '#ff7800',
                        fillOpacity: 0.2
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && feature.properties.nome) {
                            layer.bindPopup('Área: ' + feature.properties.nome);
                        }
                    }
                }).addTo(map);
            })
            .catch(error => console.warn('Aviso do GeoJSON: Verifique se está a usar um servidor local (Live Server). Detalhes:', error));
    </script>

</body>
</html>
