<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Comparação DataGeo vs ArcGIS</title>
    
    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- CSS do Side-by-Side -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-side-by-side@2.4.0/leaflet-side-by-side.min.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="info-panel">
        <strong>Comparação WebGIS</strong><br>
        Esquerda: DataGeo SP (2010) | Direita: ArcGIS Satellite
    </div>

    <div id="map"></div>

    <!-- 1. JS Principal do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 2. JS do Side-by-Side corrigido (via jsDelivr) -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-side-by-side@2.4.0/leaflet-side-by-side.min.js"></script>

    <script>
        // Inicialização do mapa centrado
        var map = L.map('map').setView([-22.1468, -48.9995], 11);

        // Mapa base de fundo geral (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 1. Lado Esquerdo: WMS DataGeo SP
        var wmsEsquerda = L.tileLayer.wms('https://datageo.ambiente.sp.gov.br/geoimage/datageoimg/ows', {
            layers: 'ORTOFOTOS_EMPLASA_2010', 
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            attribution: 'DataGeo SP'
        }).addTo(map);

        // 2. Lado Direito: ArcGIS World Imagery
        var wmsDireita = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Esri World Imagery'
        }).addTo(map);

        // 3. Ativação da ferramenta Swipe (agora com o script devidamente carregado)
        var sideBySideControl = L.control.sideBySide(wmsEsquerda, wmsDireita).addTo(map);

        // 4. Carregamento do ficheiro area.geojson (requer servidor local ativo)
        fetch('area.geojson')
            .then(response => {
                if (!response.ok) throw new Error('Erro ao aceder ao ficheiro geojson');
                return response.json();
            })
            .then(data => {
                var camadaGeoJson = L.geoJSON(data, {
                    style: {
                        color: '#ff7800',
                        weight: 3,
                        opacity: 0.8,
                        fillColor: '#ff7800',
                        fillOpacity: 0.2
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && feature.properties.nome) {
                            layer.bindPopup('Área: ' + feature.properties.nome);
                        }
                    }
                }).addTo(map);

                // Ajusta o zoom automaticamente para os limites do polígono
                map.fitBounds(camadaGeoJson.getBounds());
            })
            .catch(error => console.warn('Aviso do GeoJSON: Utilize um servidor local (ex: Live Server no VS Code).', error));
    </script>

</body>
</html>
